- title: Core Methods and Technical Stack
  type: nested_list
  contents:
    - title: Methods
      items:
        - Experimental economics, online and laboratory experiments, causal inference, and computational social science.
        - Policy-relevant behavioural data collection using real-time, multi-user, and longitudinal experimental designs.
    - title: Analysis
      items:
        - Data analysis, data cleaning, and reproducible statistical workflows in Python, R, and Stata.
        - Git-based version control and reproducible research workflows.
    - title: Infrastructure
      items:
        - FastAPI, oTree, Vue, WebSockets, RabbitMQ, Git/GitHub, and database-backed behavioural logging.
        - Custom experimental and human-AI research systems with API-based workflows.

