name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # removed md files that include liquid tags
          args: --base . --user-agent 'curl/7.54' --exclude-path _pages/404.md --exclude-path _pages/blog.md --exclude-path _posts/2018-12-22-distill.md --exclude-path _posts/2023-04-24-videos.md --exclude-path _projects/1_project.md --exclude-path _projects/2_project.md --exclude-path _projects/3_project.md --exclude-path _projects/4_project.md --exclude-path _projects/5_project.md --exclude-path _projects/6_project.md --exclude-path _projects/7_project.md --exclude-path _projects/8_project.md --exclude-path _projects/9_project.md --exclude-path _projects/freshwater.md --exclude-path _projects/saltwater.md --exclude 'file://.*%7B%7B.*%7D%7D' --exclude 'https://www\\.aau\\.at/.*' --exclude 'https?://(www\\.)?reddit\\.com/.*' --exclude 'https://papers\\.ssrn\\.com/.*' --exclude 'https?://www\\.intmath\\.com/.*' --exclude 'https?://(www\\.)?unsplash\\.com/.*' --verbose --no-progress './_news/**/*.md' './_pages/**/*.md' './_posts/**/*.md' './_projects/**/*.md'
