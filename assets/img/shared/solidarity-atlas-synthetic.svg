    <g fill="#32817c"><rect x="930" y="202" width="164" height="24" rx="8"/><rect x="930" y="258" width="112" height="24" rx="8"/><rect x="930" y="314" width="184" height="24" rx="8"/><rect x="930" y="370" width="136" height="24" rx="8"/></g>
    <g fill="#6d7e7d" font-size="12"><text x="930" y="194">Country A</text><text x="930" y="250">Country B</text><text x="930" y="306">Country C</text><text x="930" y="362">Country D</text></g>
    <rect x="326" y="500" width="840" height="186" rx="16" fill="#fff" stroke="#cfdcda"/>
    <text x="356" y="542" font-size="15" font-weight="700" fill="#2e4b50">Design and harmonisation notes</text>
